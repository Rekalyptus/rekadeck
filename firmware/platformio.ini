; Rekadeck firmware for the SparkFun Thing Plus ESP32-S3 (ESP32-S3-MINI-1, 4 MB flash, 2 MB PSRAM)
; with the Waveshare 7.5" V2 panel (800 x 480, black and white) on the Waveshare e-Paper Driver HAT.
;
;   pio run                   build the development firmware
;   pio run -t upload         flash it over USB-C
;   pio run -e release        the release build (tools/release.py runs this)
;   pio device monitor        serial log at 115200
;
; The device logic lives in lib/rekacore and is the same code the desktop simulator runs.
; src/hal_esp32.cpp and src/panel.cpp are the only board-specific parts. No outside libraries needed.

[platformio]
default_envs = rekadeck

[env]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; the Thing Plus has 4 MB of flash and 2 MB of quad PSRAM
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; keeps the build machine's folder names (and so its user name) out of the firmware image
extra_scripts = pre:scripts/build_paths.py

; Development: where the device looks for the server until you type another address in the setup page. Put your
; computer's LAN address here (the mock server in ../server prints it when it starts).
[env:rekadeck]
build_flags =
  ${env.build_flags}
  -DREKA_DEFAULT_SERVER='"http://192.168.1.100:8000"'

; What ships: the hosted service over HTTPS
[env:release]
build_flags =
  ${env.build_flags}
  -DREKA_DEFAULT_SERVER='"https://rekalyptus.com"'
